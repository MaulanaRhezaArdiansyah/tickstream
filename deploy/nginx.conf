# nginx di depan app, untuk VPS yang sudah memakai nginx di port 80/443 (tanpa Caddy).
# Ganti domain dan port (APP_PORT di .env), lalu:
#   sudo cp nginx.conf /etc/nginx/sites-available/tickstream
#   sudo ln -s /etc/nginx/sites-available/tickstream /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tickstream.example.com --redirect
server {
    listen 80;
    listen [::]:80;
    server_name tickstream.example.com;

    # WebSocket: nginx baru meneruskan upgrade kalau diminta eksplisit. Tanpa trade (bursa
    # tutup, tanpa kripto) koneksi bisa diam lama; browser menyambung ulang kalau terputus.
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Nama file di /assets mengandung hash isi (hasil Vite): aman di-cache selamanya.
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
}
